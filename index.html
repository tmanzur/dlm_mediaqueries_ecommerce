<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero.</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/2db924c8ac.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="grid-container">

        <!-- Navbar -->
        <nav class="navbar">

            <div class="navbar-items">

                <div class="logo">
                    <img class="img-navbar" src="./assets/img/logo_transparent.png" alt="Logo">
                    <h2>Tablero<em>.</em></h2>
                </div>
                
                <div class="menu">
                    <i class="fa-solid fa-bars fa-2xl" style="color: #f5f0e8;"></i>
                    
                    <ul class="menu-links">
                        <li>
                            <a href="#">Inicio</a>
                        </li>
                        <li>
                            <a href="#">Catálogo</a>
                        </li>
                        <li>
                            <a href="#">Ofertas</a>
                        </li>
                        <li>
                            <a href="#">Contacto</a>
                        </li>
                    </ul>
                </div>
                
            </div>



        </nav>

        <!-- Header -->
        <header class="search">
            <h5>Ordenar por:</h5>
            <select class="desplegable">
                <option value="">Precio</option>
            </select>
        </header>

        <!-- Products -->
        <main class="container">
            <div class="boxes">

                <div class="product-boxes">

                    <div class="box">
                        <img class="img-box" src="./assets/img/wingspan.png" alt="Wingspan">
                        <h4>Wingspan</h4>
                        <button class="btn-box">Ver más</button>
                    </div>

                    <div class="box">
                        <img class="img-box" src="./assets/img/azul_1.png" alt="">
                        <h4>Azul</h4>
                        <button class="btn-box">Ver más</button>
                    </div>

                    <div class="box">
                        <img class="img-box" src="./assets/img/coffe_rush.jpg" alt="">
                        <h4>Coffe Rush</h4>
                        <button class="btn-box">Ver más</button>
                    </div>

                    <div class="box">
                        <img class="img-box" src="./assets/img/harmonies.png" alt="">
                        <h4>Harmonies</h4>
                        <button class="btn-box">Ver más</button>
                    </div>

                    <div class="box">
                        <img class="img-box" src="./assets/img/carcassone.png" alt="">
                        <h4>Carcassone</h4>
                        <button class="btn-box">Ver más</button>
                    </div>

                    <div class="box">
                        <img class="img-box" src="./assets/img/flamecraft.png" alt="">
                        <h4>Flamecraft</h4>
                        <button class="btn-box">Ver más</button>
                    </div>

                    <div class="box">
                        <img class="img-box" src="./assets/img/toy_battle.png" alt="">
                        <h4>Toy Battle</h4>
                        <button class="btn-box">Ver más</button>
                    </div>

                    <div class="box">
                        <img class="img-box" src="./assets/img/monkey_palace.png" alt="">
                        <h4>Monkey Palace</h4>
                        <button class="btn-box">Ver más</button>
                    </div>



                </div>

                <div class="container-pag">
                    <div class="pagination">
                        <button class="btn-pag">≪</button>
                        <button class="btn-pag">1</button>
                        <button class="btn-pag">2</button>
                        <button class="btn-pag">3</button>
                        <button class="btn-pag">≫</button>
                    </div>
                </div>

            </div>
        </main>


        <!-- Footer -->
        <footer class="foot">

            <i class="fa-brands fa-square-facebook fa-lg" style="color: #191c2a;"></i>
            <i class="fa-brands fa-instagram fa-lg" style="color: #191c2a;"></i>

            <p>Todos los derechos reservados</p>
        </footer>

    </div>
</body>

</html>
